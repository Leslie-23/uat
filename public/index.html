  }

  function lastLine(la){
    if (!la) return el("span", {class: "last", text: "No activity yet"});
    return el("span", {class: "last"}, ["Last activity: ", el("b", {text: la.tester || "Someone"}), " · " + timeAgo(la.updatedAt)]);
  }

  function renderProjectCards(stats, scope){
    var grid = el("div", {class: "app-grid"});
    APPS.forEach(function(a){
      var s = stats[a.id];
      if (!s) return;
      var card = el("div", {class: "app-card"});
      card.appendChild(el("div", {class: "app-card-head"}, [
        el("div", {}, [
          el("h3", {text: a.label}),
          el("div", {class: "sub", text: plural((S.cases[a.id] || []).length, "case") + " · " + s.pct + "% done"}),
          lastLine(lastActivity(a.id, scope))
        ]),
        s.issues ? el("span", {class: "pill fail", text: plural(s.issues, "issue")})
          : s.total && s.done === s.total ? el("span", {class: "pill pass", text: "Complete"})
          : el("span", {class: "pill notrun", text: s.done ? "In progress" : "Not started"})
      ]));
      PLATFORMS.filter(function(p){ return !scope || p.id === scope; }).forEach(function(p){
        var ps = projectStats(a.id, p.id);
        card.appendChild(el("button", {
          class: "plat-row", type: "button", "aria-label": "Open " + a.label + " on " + p.label,
          onclick: function(){ goCases(a.id, p.id); }
        }, [
          el("span", {class: "plat-name", text: p.label}),
          el("span", {}, [stackedBar(ps, "pr:" + a.id + ":" + p.id), el("span", {class: "plat-stats"}, [
            el("span", {}, [el("span", {class: "sdot pass"}), ps.Pass + " pass"]),
            el("span", {style: ps.Fail ? "color:var(--fail)" : null}, [el("span", {class: "sdot fail"}), ps.Fail + " fail"]),
            el("span", {style: ps.Blocked ? "color:var(--blocked)" : null}, [el("span", {class: "sdot blocked"}), ps.Blocked + " blocked"]),
            el("span", {}, [el("span", {class: "sdot notrun"}), ps["Not run"] + " left"])
          ])]),
          el("span", {class: "plat-pct"}, [ps.pct + "%", el("small", {text: ps.done + "/" + ps.total})])
        ]));
      });
      grid.appendChild(card);
    });
    return grid;
  }

  function renderProjectTable(stats, scope){
    var rows = APPS.filter(function(a){ return stats[a.id]; }).map(function(a, i){
      var la = lastActivity(a.id, scope);
      return {a: a, i: i, s: stats[a.id], ios: projectStats(a.id, "ios"), android: projectStats(a.id, "android"), la: la, last: la ? new Date(la.updatedAt).getTime() : 0};
    });
    var get = {
      name: function(r){ return r.a.label.toLowerCase(); }, ios: function(r){ return r.ios.pct; }, android: function(r){ return r.android.pct; },
      overall: function(r){ return r.s.pct; }, fail: function(r){ return r.s.Fail; }, blocked: function(r){ return r.s.Blocked; }, last: function(r){ return r.last; }
    };
    var sort = S.dashSort;
    rows.sort(function(x, y){
      if (!sort.key) return x.i - y.i;
      var gx = get[sort.key](x), gy = get[sort.key](y);
      var c = gx < gy ? -1 : gx > gy ? 1 : x.i - y.i;
      return sort.dir === "asc" ? c : -c;
    });
    var cols = [["name", "Project"], ["ios", "iOS"], ["android", "Android"], ["overall", scope ? platLabel(scope) + " total" : "Overall"], ["fail", "Fail"], ["blocked", "Blocked"], ["last", "Last active"]];
    var head = el("tr", {}, cols.map(function(c){
      var active = sort.key === c[0];
      return el("th", {scope: "col", "aria-sort": active ? (sort.dir === "asc" ? "ascending" : "descending") : null}, [
        el("button", {type: "button", "data-fk": "sort:" + c[0], onclick: function(){
          if (S.dashSort.key === c[0]) S.dashSort = {key: c[0], dir: S.dashSort.dir === "asc" ? "desc" : "asc"};
          else S.dashSort = {key: c[0], dir: c[0] === "name" ? "asc" : "desc"};
          render();
        }}, [c[1], active ? (sort.dir === "asc" ? " ↑" : " ↓") : ""])
      ]);
    }));
    function barCell(r, plat){
      var ps = r[plat];
      return el("td", {}, [el("button", {class: "cell-bar", type: "button", "aria-label": "Open " + r.a.label + " on " + platLabel(plat),
        onclick: function(ev){ ev.stopPropagation(); goCases(r.a.id, plat); }}, [stackedBar(ps, "tb:" + r.a.id + ":" + plat), el("span", {class: "pct", text: ps.pct + "%"})])]);
    }
    function num(n, cls){ return el("td", {class: "num " + (n ? cls : "zero"), text: String(n)}); }
    var body = el("tbody");
    rows.forEach(function(r){
      body.appendChild(el("tr", {onclick: function(){ goCases(r.a.id, scope || S.platform); }}, [
        el("td", {class: "proj"}, [r.a.label, el("div", {class: "muted-sm", text: plural((S.cases[r.a.id] || []).length, "case")})]),
        barCell(r, "ios"), barCell(r, "android"),
        el("td", {}, [el("span", {class: "num", text: r.s.pct + "%"}), el("div", {class: "muted-sm", text: r.s.done + "/" + r.s.total + " runs"})]),
        num(r.s.Fail, "fail"), num(r.s.Blocked, "blocked"),
        r.la ? el("td", {class: "muted-sm"}, [el("div", {style: "color:var(--fg);font-weight:600", text: String(r.la.tester || "Someone").split(" ")[0]}), timeAgo(r.la.updatedAt)])
             : el("td", {class: "muted-sm", text: "—"})
      ]));
    });
    return el("div", {class: "table-wrap"}, [el("table", {class: "htable"}, [el("thead", {}, [head]), body])]);
  }

  function panel(title, items, emptyText, extra){
    var count = items.length;
    var box = el("section", {class: "panel"}, [el("div", {class: "panel-head"}, [
      el("h3", {text: title}), extra || (count ? el("span", {class: "sb-badge" + (extra === false ? " ok" : ""), text: String(count)}) : null)
    ])]);
    if (!count) { box.appendChild(el("div", {class: "panel-empty", text: emptyText})); return box; }
    var list = el("div");
    items.slice(0, 6).forEach(function(n){ list.appendChild(n()); });
    box.appendChild(list);
    if (count > 6) box.appendChild(el("div", {class: "panel-more", text: "+ " + (count - 6) + " more"}));
    return box;
  }

  function renderAttention(scope){
    var items = [];
    APPS.forEach(function(a){
      var byId = {};
      (S.cases[a.id] || []).forEach(function(c){ byId[c.id] = c; });
      PLATFORMS.forEach(function(p){
        if (scope && p.id !== scope) return;
        var map = S.results[rk(a.id, p.id)] || {};
        Object.keys(map).forEach(function(id){
          var st = statusOf(map, id);
          if (byId[id] && (st === "Fail" || st === "Blocked")) items.push({app: a.id, platform: p.id, c: byId[id], r: map[id], status: st});
        });
      });
    });
    items.sort(function(x, y){ return (x.status === "Fail" ? 0 : 1) - (y.status === "Fail" ? 0 : 1) || new Date(y.r.updatedAt) - new Date(x.r.updatedAt); });
    return panel("Needs attention", items.map(function(it){ return function(){
      return el("button", {class: "feed-item", type: "button", onclick: function(){ goToCase(it.app, it.platform, it.c.id); }}, [
        el("span", {class: "pill " + CLS[it.status], text: it.status}),
        el("span", {class: "body"}, [
          el("span", {class: "title", text: it.c.scenario}),
          el("span", {class: "meta", text: it.c.id + " · " + appLabel(it.app) + " · " + platLabel(it.platform) + " · " + timeAgo(it.r.updatedAt)}),
          el("span", {class: "note", text: (it.r.comments || "").trim() || "No details yet. Add a note so devs can reproduce it."})
        ])
      ]);
    }; }), "No failed or blocked cases right now.");
  }

  function renderHighPriority(scope){
    var items = [];
    APPS.forEach(function(a){
      (S.cases[a.id] || []).forEach(function(c){
        if (!/^(critical|high)$/i.test(String(c.priority || "").trim())) return;
        var missing = PLATFORMS.filter(function(p){ return (!scope || p.id === scope) && statusOf(S.results[rk(a.id, p.id)], c.id) === "Not run"; });
        if (missing.length) items.push({app: a.id, c: c, missing: missing, crit: /critical/i.test(c.priority)});
      });
    });
    items.sort(function(x, y){ return (y.crit ? 1 : 0) - (x.crit ? 1 : 0); });
    return panel("High priority, not run", items.map(function(it){ return function(){
      return el("button", {class: "feed-item", type: "button", onclick: function(){ goToCase(it.app, it.missing[0].id, it.c.id); }}, [
        el("span", {class: "tag " + (it.crit ? "crit" : "high"), text: it.crit ? "Critical" : "High"}),
        el("span", {class: "body"}, [
          el("span", {class: "title", text: it.c.scenario}),
          el("span", {class: "meta", text: it.c.id + " · " + appLabel(it.app) + " · not run on " + it.missing.map(function(p){ return p.label; }).join(" + ")})
        ])
      ]);
    }; }), "Every Critical and High case has been run" + (scope ? " on " + platLabel(scope) : "") + ".");
  }

  function renderMismatches(){
    var items = [];
    function bad(x){ return x === "Fail" || x === "Blocked"; }
    APPS.forEach(function(a){
      var mi = S.results[rk(a.id, "ios")] || {}, ma = S.results[rk(a.id, "android")] || {};
      (S.cases[a.id] || []).forEach(function(c){
        var si = statusOf(mi, c.id), sa = statusOf(ma, c.id);
        if ((si === "Pass" && bad(sa)) || (sa === "Pass" && bad(si))) items.push({app: a.id, c: c, si: si, sa: sa, failOn: bad(si) ? "ios" : "android"});
      });
    });
    return panel("Platform mismatches", items.map(function(it){ return function(){
      return el("button", {class: "feed-item", type: "button", onclick: function(){ goToCase(it.app, it.failOn, it.c.id); }}, [
        el("span", {class: "body"}, [
          el("span", {class: "title", text: it.c.scenario}),
          el("span", {class: "meta", text: it.c.id + " · " + appLabel(it.app)}),
          el("span", {class: "pair"}, [
            el("span", {class: "pill " + CLS[it.si], text: "iOS " + it.si}),
            el("span", {class: "pill " + CLS[it.sa], text: "Android " + it.sa})
          ])
        ])
      ]);
    }; }), "iOS and Android agree on every case tested on both. A pass on one platform with a fail on the other will show here.");
  }

  function renderRecent(scope){
    var items = [];
    APPS.forEach(function(a){
      var byId = {};
      (S.cases[a.id] || []).forEach(function(c){ byId[c.id] = c; });
      PLATFORMS.forEach(function(p){
        if (scope && p.id !== scope) return;
        var map = S.results[rk(a.id, p.id)] || {};
        Object.keys(map).forEach(function(id){
          var st = statusOf(map, id);
          if (byId[id] && st !== "Not run" && map[id].updatedAt) items.push({app: a.id, platform: p.id, c: byId[id], r: map[id], status: st});
        });
      });
    });
    items.sort(function(x, y){ return new Date(y.r.updatedAt) - new Date(x.r.updatedAt); });
    var link = isAdmin() ? el("button", {class: "link-btn", type: "button", style: "font-size:12px", text: "Full history", onclick: function(){ goView("history"); }}) : null;
    return panel("Recent activity", items.map(function(it){ return function(){
      return el("button", {class: "feed-item", type: "button", onclick: function(){ goToCase(it.app, it.platform, it.c.id); }}, [
        el("span", {class: "avatar sm alt", text: initials(it.r.tester), "aria-hidden": "true"}),
        el("span", {class: "body"}, [
          el("span", {class: "title", text: (it.r.tester || "Someone") + " marked " + it.c.id + " " + it.status}),
          el("span", {class: "meta", text: appLabel(it.app) + " · " + platLabel(it.platform) + " · " + timeAgo(it.r.updatedAt)}),
          el("span", {class: "note", text: it.c.scenario})
        ]),
        el("span", {class: "pill " + CLS[it.status], text: it.status})
      ]);
    }; }), "No results recorded yet. Pick a project to start testing.", link);
  }

  // ===================================================================
  // view: history (admin)
  // ===================================================================
  function loadHistory(){
    S.historyStatus = S.history ? "refreshing" : "loading";
    var f = S.historyFilter, qs = [];
    if (f.app) qs.push("app=" + encodeURIComponent(f.app));
    if (f.platform) qs.push("platform=" + encodeURIComponent(f.platform));
    var want = JSON.stringify([f.app, f.platform]);
    api("/api/admin/history" + (qs.length ? "?" + qs.join("&") : "")).then(function(rows){
      if (want !== JSON.stringify([S.historyFilter.app, S.historyFilter.platform])) return;
      S.history = rows || []; S.historyStatus = "ready";
    }).catch(function(e){ S.historyStatus = "error"; S.loadError.history = e.message; })
      .then(function(){ if (S.view === "history") render(); });
  }

  function renderHistory(main){
    var f = S.historyFilter;
    var appSel = el("select", {class: "select", "aria-label": "Project", "data-fk": "h-app", onchange: function(){ f.app = appSel.value; S.history = null; loadHistory(); render(); }},
      [el("option", {value: "", text: "All projects"})].concat(APPS.map(function(a){ return el("option", {value: a.id, text: a.label}); })));
    appSel.value = f.app;
    var platSel = el("select", {class: "select", "aria-label": "Platform", "data-fk": "h-plat", onchange: function(){ f.platform = platSel.value; S.history = null; loadHistory(); render(); }},
      [el("option", {value: "", text: "All platforms"})].concat(PLATFORMS.map(function(p){ return el("option", {value: p.id, text: p.label}); })));
    platSel.value = f.platform;
    var q = el("input", {class: "select", type: "search", placeholder: "Filter by tester or case", "aria-label": "Filter by tester or case", value: f.q, "data-fk": "h-q"});
    var qt; q.addEventListener("input", function(){ clearTimeout(qt); qt = setTimeout(function(){ f.q = q.value; render(); }, 150); });
    var refreshing = S.historyStatus === "refreshing" || S.historyStatus === "loading";
    main.appendChild(el("div", {class: "page-head"}, [
      el("div", {}, [el("p", {text: "The latest 300 changes. Click a case to open it."})]),
      el("div", {class: "page-actions"}, [appSel, platSel, q,
        el("button", {class: "btn", type: "button", disabled: refreshing, onclick: function(){ loadHistory(); render(); }, "data-fk": "h-refresh"}, refreshing ? [el("span", {class: "spinner"}), "Refreshing"] : ["Refresh"])])
    ]));
    if (S.historyStatus === "error" && !S.history) {
      main.appendChild(stateBox("Couldn't load history", S.loadError.history, {label: "Try again", primary: true, run: function(){ loadHistory(); render(); }}, true));
      return;
    }
    if (!S.history) { main.appendChild(skeleton(6)); return; }
    var needle = f.q.trim().toLowerCase();
    var rows = S.history.filter(function(h){ return !needle || ((h.tester || "") + " " + (h.caseId || "")).toLowerCase().indexOf(needle) !== -1; });
    if (!rows.length) {
      main.appendChild(stateBox(S.history.length ? "No changes match" : "No changes yet",
        S.history.length ? "Try a different filter." : "Results and notes will appear here as testers record them."));
      return;
    }
    var day = null, list = null;
    rows.forEach(function(h){
      var d = dayLabel(h.changedAt);
      if (d !== day) {
        day = d; main.appendChild(el("div", {class: "history-day", text: d}));
        list = el("div", {class: "history-list"}); main.appendChild(list);
      }
      var res = h.result && CLS[h.result] ? h.result : null;
      list.appendChild(el("div", {class: "history-row"}, [
        el("span", {class: "time", text: fmtTime(h.changedAt), title: new Date(h.changedAt).toLocaleString()}),
        el("span", {class: "pillcell"}, [el("span", {class: "pill " + (res ? CLS[res] : "notrun"), text: res || "Note"})]),
        el("div", {class: "what"}, [
          el("div", {}, [
            el("button", {class: "link-btn mono", type: "button", text: h.caseId, onclick: function(){ goToCase(h.app, h.platform, h.caseId); }}),
            el("span", {class: "muted", text: " · " + appLabel(h.app) + " · " + platLabel(h.platform) + " · by "}),
            el("strong", {text: h.tester || "unknown"})
          ]),
          h.comments ? el("div", {class: "comment", text: h.comments}) : null
        ])
      ]));
    });
  }

  // ===================================================================
  // keyboard
  // ===================================================================
  function showShortcuts(){
    var rows = [["P F B N", "Mark the open case Pass / Fail / Blocked / N/A"], ["J K", "Open next / previous case"], ["Enter", "Open the focused case"],
      ["Esc", "Close the case, dialog or image"], ["/", "Search cases"], ["⌘/Ctrl V", "Paste a screenshot into the open case"], ["?", "Show this list"]];
    var list = el("div", {class: "kb-list"});
    rows.forEach(function(r){
      list.appendChild(el("span", {}, r[0].split(" ").map(function(k){ return el("kbd", {text: k}); })));
      list.appendChild(el("span", {text: r[1]}));
    });
    openModal({title: "Keyboard shortcuts", body: [list], submitLabel: "Got it", cancelLabel: "Close", onSubmit: function(close){ close(); }});
  }

  document.addEventListener("keydown", function(ev){
    if (ev.key === "Tab") {
      var top = lightbox || (activeModal && activeModal.node) || document.querySelector("#caseLayer .cm") || (S.sidebarOpen && isDrawer() && $("sidebar"));
      if (top) {
        var f = Array.prototype.filter.call(top.querySelectorAll("button, [href], input, textarea, select, [tabindex]:not([tabindex='-1'])"), function(n){ return !n.disabled && n.offsetParent !== null; });
        if (f.length) {
          var first = f[0], last = f[f.length - 1];
          if (!top.contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
          else if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
          else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
        }
      }
      return;
    }
    if (ev.key === "Escape") {
      if (lightbox) { closeLightbox(); return; }
      if (activeModal) { if (activeModal.dismissable) closeModal(); return; }
      if (S.view === "cases" && S.openCard) {
        if (isTyping()) { document.activeElement.blur(); return; }
        openCase(null); return;
      }
      if (S.sidebarOpen) { setSidebar(false); $("menuBtn").focus(); return; }
    }
    if (!S.auth || activeModal || lightbox || isTyping() || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === "?") { ev.preventDefault(); showShortcuts(); return; }
    if (S.view !== "cases") return;
    if (ev.key === "/") { var s = $("searchInput"); if (s && !S.openCard) { ev.preventDefault(); s.focus(); } return; }
    var key = ev.key.toLowerCase();
    if (key === "j") { ev.preventDefault(); stepCase(1); return; }
    if (key === "k") { ev.preventDefault(); stepCase(-1); return; }
    if (S.openCard) {
      var opt = RESULTS.filter(function(o){ return o.kb === key; })[0];
      if (opt) {
        var c = (S.cases[S.app] || []).filter(function(x){ return x.id === S.openCard; })[0];
        if (c) { ev.preventDefault(); setResult(c, opt.key); }
      }
    }
  });

  // ===================================================================
  // boot
  // ===================================================================
  function boot(){
    $("loginScreen").hidden = true;
    $("app").hidden = false;
    var savedView = store.get("uat_view");
    setConn("syncing");
    startPolling();
    // One request pair fills the sidebar and dashboard for every project.
    loadOverview().catch(function(){}).then(function(){ if (S.auth && S.view !== "cases") render(); else if (S.auth) renderSidebar(); });
    var route = parseRoute(location.hash);
    if (route) { S.view = "dashboard"; applyRoute(route); }
    else if (savedView === "cases") goCases(S.app, S.platform);
    else { S.view = savedView === "history" && isAdmin() ? "history" : "dashboard"; if (S.view === "history") loadHistory(); render(); }
    api("/api/me").then(function(me){
      if (me && me.role && S.auth && me.role !== S.auth.role) {
        S.auth.role = me.role; store.set("uat_auth", JSON.stringify(S.auth));
        if (!isAdmin() && S.view === "history") goView("dashboard"); else render();
      }
    }).catch(function(){});
    if (!S.tester) askTester();
  }

  applyTheme();
  $("menuBtn").appendChild(icon("menu"));
  $("logoutBtn").insertBefore(icon("logout"), $("logoutBtn").firstChild);
  $("adminSettingsBtn").insertBefore(icon("lock"), $("adminSettingsBtn").firstChild);
  $("loginForm").addEventListener("submit", doLogin);
  $("pwToggle").addEventListener("click", function(){
    var i = $("loginPassword"), show = i.type === "password";
    i.type = show ? "text" : "password";
    this.textContent = show ? "Hide" : "Show";
    this.setAttribute("aria-pressed", String(show));
    i.focus();
  });
  $("logoutBtn").addEventListener("click", logout);
  $("adminSettingsBtn").addEventListener("click", openPassphraseModal);
  $("whoBtn").addEventListener("click", function(){ flushAllComments(); askTester(); });
  $("menuBtn").addEventListener("click", function(){ setSidebar(true); });
  $("sbClose").addEventListener("click", function(){ setSidebar(false); $("menuBtn").focus(); });
  $("sbScrim").addEventListener("click", function(){ setSidebar(false); });
  window.addEventListener("resize", function(){ if (!isDrawer() && S.sidebarOpen) setSidebar(false); });
  setInterval(function(){ if (S.auth) S.dirty = true; }, 60000);   // keep "x min ago" labels fresh

  if (S.auth && S.auth.token) boot(); else showLogin("");
})();
</script>
