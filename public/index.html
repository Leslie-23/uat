<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#ffffff">
<title>UAT Tracker</title>
<script>
  // Apply the saved theme before first paint so there's no flash.
  (function(){ try { var t = localStorage.getItem("uat_theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap">
<style>
  /* ================= design tokens (light default) ================= */
  :root{
    --bg:#ffffff; --surface:#ffffff; --surface-2:#f9fafb; --border:#e5e7eb;
    --fg:#20231f; --fg-muted:#6b6a5f; --accent:#1f6f4a; --accent-fg:#ffffff;
    --pass:#1f6f4a; --pass-bg:#e4f1e9; --fail:#b3261e; --fail-bg:#fbe8e7;
    --blocked:#9a6a00; --blocked-bg:#fbf0d9; --na:#6b6a5f; --na-bg:#f3f4f6;
    --notrun-bg:#f3f4f6;
    --shadow:0 1px 2px rgba(32,35,31,.04), 0 8px 24px rgba(32,35,31,.08);
    --shadow-sm:0 1px 2px rgba(32,35,31,.08);
    --overlay:rgba(32,35,31,.45);
    --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
    /* Labels, IDs and numbers also use Jakarta; tabular figures keep columns aligned. */
    --font-mono:'Plus Jakarta Sans',system-ui,sans-serif;
    --font-code:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sidebar-w:268px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000; --surface:#121212; --surface-2:#1a1a1a; --border:#2a2a2a;
      --fg:#f0f0f0; --fg-muted:#9a9a9a; --accent:#5fcf9a; --accent-fg:#06160f;
      --pass:#5fcf9a; --pass-bg:#0f2a1c; --fail:#ff6b61; --fail-bg:#2a1210;
      --blocked:#e8b84b; --blocked-bg:#2a2008; --na:#9a9a9a; --na-bg:#1f1f1f;
      --notrun-bg:#1f1f1f;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.6);
      --shadow-sm:0 1px 2px rgba(0,0,0,.6);
      --overlay:rgba(0,0,0,.7);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --surface:#121212; --surface-2:#1a1a1a; --border:#2a2a2a;
    --fg:#f0f0f0; --fg-muted:#9a9a9a; --accent:#5fcf9a; --accent-fg:#06160f;
    --pass:#5fcf9a; --pass-bg:#0f2a1c; --fail:#ff6b61; --fail-bg:#2a1210;
    --blocked:#e8b84b; --blocked-bg:#2a2008; --na:#9a9a9a; --na-bg:#1f1f1f;
    --notrun-bg:#1f1f1f;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.6);
    --overlay:rgba(0,0,0,.7);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-display);line-height:1.45;-webkit-font-smoothing:antialiased}
  [hidden]{display:none !important}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .gutter{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  @media (min-width:1024px){ .gutter{padding-left:28px;padding-right:28px} }
  .wrap{max-width:1320px;margin:0 auto}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  body{font-feature-settings:"tnum" 0}
  .progress-label,.kpi .val,.plat-pct,.sb-proj .meta,.case-id,.filter-chip .count{font-variant-numeric:tabular-nums}
  .muted{color:var(--fg-muted)}
  .ico{width:16px;height:16px;flex:0 0 auto;display:block}

  /* ================= buttons ================= */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-mono);font-size:12px;font-weight:600;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);cursor:pointer;white-space:nowrap;text-decoration:none}
  .btn:hover{border-color:var(--fg-muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{background:var(--fail);border-color:var(--fail);color:#fff}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--fg-muted)}
  .btn.ghost:hover{color:var(--fg);border-color:var(--border)}
  .btn.block{width:100%;padding:11px;font-size:13px}
  .btn.sm{font-size:11px;padding:5px 9px;border-radius:7px}
  .btn:disabled{opacity:.55;cursor:not-allowed;filter:none}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:600;padding:6px 9px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg-muted);cursor:pointer;white-space:nowrap}
  .icon-btn:hover{color:var(--fg)}
  .link-btn{background:none;border:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .spinner{width:12px;height:12px;border-radius:999px;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .7s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  kbd{font-family:var(--font-code);font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;border:1px solid var(--border);border-bottom-width:2px;background:var(--surface);color:var(--fg-muted)}
  .seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
  .seg button{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;border:none;background:none;color:var(--fg-muted);cursor:pointer;white-space:nowrap}
  .seg button:hover{color:var(--fg)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}

  /* ================= shell: sidebar ================= */
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40;overflow-y:auto;overscroll-behavior:contain;padding:16px 12px max(14px, env(safe-area-inset-bottom,0px))}
  .content{margin-left:var(--sidebar-w);min-width:0;min-height:100vh}
  .sb-scrim{display:none}
  @media (max-width:1023px){
    .sidebar{transform:translateX(-100%);transition:transform .2s ease;box-shadow:none;width:min(300px, 86vw)}
    body.sb-open .sidebar{transform:none;box-shadow:var(--shadow)}
    body.sb-open .sb-scrim{display:block;position:fixed;inset:0;background:var(--overlay);z-index:35}
    body.sb-open{overflow:hidden}
    .content{margin-left:0}
  }
  .sb-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-family:var(--font-mono);font-weight:600;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .sb-title{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
  .sb-sub{font-size:11.5px;color:var(--fg-muted)}
  .sb-close{margin-left:auto}
  @media (min-width:1024px){ .sb-close{display:none} }
  .sb-label{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted);padding:16px 10px 6px;font-weight:600}
  .sb-label .mono{text-transform:none;letter-spacing:0;font-weight:500}
  .sb-nav{display:flex;flex-direction:column;gap:2px}
  .sb-link{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500;color:var(--fg-muted)}
  .sb-link:hover{background:var(--surface-2);color:var(--fg)}
  .sb-link[aria-current="page"]{background:var(--surface-2);color:var(--fg);border-color:var(--border);font-weight:600}
  .sb-link .count{margin-left:auto}
  .sb-proj{display:block;width:100%;padding:9px 10px 10px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;text-align:left}
  .sb-proj:hover{background:var(--surface-2)}
  .sb-proj[aria-current="page"]{background:var(--surface-2);border-color:var(--border);box-shadow:inset 3px 0 0 var(--accent)}
  .sb-proj .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sb-proj .name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-proj .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted);margin-top:6px}
  .sb-proj .progress-track{height:4px;margin-top:6px}
  .sb-badge{font-family:var(--font-mono);font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--fail-bg);color:var(--fail);white-space:nowrap}
  .sb-badge.ok{background:var(--pass-bg);color:var(--pass)}
  .sb-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
  .sb-foot .seg{display:grid;grid-template-columns:repeat(3,1fr)}
  .sb-foot-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .sb-foot-row .icon-btn{flex:1}
  .who{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;text-align:left}
  .who:hover{border-color:var(--fg-muted)}
  .who.missing{border-color:var(--blocked)}
  .who .name{font-size:13px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who .sub{font-size:11px;color:var(--fg-muted);display:block}
  .who .txt{flex:1;min-width:0}
  .avatar{width:28px;height:28px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-family:var(--font-mono);font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .avatar.sm{width:24px;height:24px;font-size:9.5px}
  .avatar.alt{background:var(--surface-2);color:var(--fg-muted);border:1px solid var(--border)}
  .role-badge{font-family:var(--font-mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface);color:var(--fg-muted);border:1px solid var(--border);white-space:nowrap}
  .role-badge.admin{color:var(--accent);border-color:var(--accent)}

  /* ================= shell: top bar ================= */
  .topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
  .topbar-inner{display:flex;align-items:flex-start;gap:12px;padding-block:14px 12px}
  .menu-btn{display:none;padding:7px}
  @media (max-width:1023px){ .menu-btn{display:inline-flex} }
  .tb-title{flex:1;min-width:0}
  .crumbs{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--fg-muted);margin-bottom:1px}
  .crumbs button{background:none;border:none;padding:0;color:var(--fg-muted);cursor:pointer;font-size:11.5px}
  .crumbs button:hover{color:var(--fg);text-decoration:underline}
  h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
  .subtitle{font-size:12.5px;color:var(--fg-muted);margin:2px 0 0}
  .tb-right{display:flex;gap:8px;align-items:center;padding-top:2px}
  @media (max-width:639px){
    .topbar-inner{align-items:center;padding-block:10px}
    .subtitle,.conn .txt{display:none}
    h1{font-size:16px}
  }
  .conn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted);white-space:nowrap}
  .conn .dot{width:7px;height:7px;border-radius:999px;background:var(--fg-muted)}
  .conn.live .dot{background:var(--pass);box-shadow:0 0 0 3px var(--pass-bg)}
  .conn.syncing .dot{background:var(--blocked)}
  .conn.offline{color:var(--fail)} .conn.offline .dot{background:var(--fail);box-shadow:0 0 0 3px var(--fail-bg)}

  .context-row{display:flex;align-items:center;gap:12px;padding-bottom:12px;flex-wrap:wrap}
  .platform-row{display:flex;gap:6px}
  .platform-chip{font-family:var(--font-mono);font-size:11.5px;font-weight:600;padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg-muted);cursor:pointer}
  .platform-chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
  .progress-row{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
  .progress-track{flex:1;min-width:0;height:6px;border-radius:999px;background:var(--border);overflow:hidden;display:flex}
  .progress-track span{height:100%;transition:width .7s cubic-bezier(.2,.7,.2,1)}
  .progress-label{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .progress-label b{color:var(--fg);font-weight:600}

  /* ================= main ================= */
  main{padding-block:18px 64px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .filter-row{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
  .filter-row::-webkit-scrollbar{display:none}
  @media (min-width:640px){ .filter-row{flex-wrap:wrap} }
  .filter-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--fg-muted);cursor:pointer}
  .filter-chip:hover{color:var(--fg)}
  .filter-chip[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);border-color:var(--fg-muted)}
  .filter-chip .count{font-variant-numeric:tabular-nums;opacity:.8}
  .sdot{width:7px;height:7px;border-radius:999px;display:inline-block;flex:0 0 auto}
  .sdot.pass{background:var(--pass)} .sdot.fail{background:var(--fail)} .sdot.blocked{background:var(--blocked)} .sdot.na{background:var(--na)} .sdot.notrun{background:transparent;border:1.5px solid var(--fg-muted)}
  .search{position:relative;flex:0 1 260px;min-width:160px}
  .search input{width:100%;padding:7px 30px 7px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-family:var(--font-display);font-size:13px}
  .search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none}
  .search input:not(:placeholder-shown) + kbd{display:none}
  @media (max-width:639px){ .search{flex:1 1 100%} .search kbd{display:none} }

  .banner{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .banner.done{background:var(--pass-bg);border-color:transparent}
  .banner-text{font-size:13px;min-width:0;flex:1 1 260px}
  .banner-text strong{display:block;font-size:14px}
  .banner-text .muted{font-size:12.5px}
  .banner-actions{display:flex;gap:6px;flex-wrap:wrap}

  .notes-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden}
  .notes-toggle{display:flex;width:100%;align-items:center;gap:8px;padding:12px 14px;background:none;border:none;cursor:pointer;text-align:left}
  .notes-title{font-size:13px;font-weight:600;margin:0;flex:1}
  .notes-count{font-family:var(--font-mono);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--fg-muted)}
  .notes-body{padding:0 14px 14px}
  .notes-form{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
  .notes-form textarea{flex:1;min-height:42px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--fg);font-family:var(--font-display);font-size:13px;padding:8px 10px;resize:vertical}
  .notes-form textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .note-row{padding:9px 0;border-top:1px solid var(--border);font-size:13px;white-space:pre-line}
  .note-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted);margin-bottom:2px;white-space:normal}

  .module{margin-bottom:18px}
  .module-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px}
  .module-head h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);margin:0}
  .module-head .mono{font-size:10.5px;color:var(--fg-muted)}
  .case-grid{display:block}
  @media (min-width:760px){
    .case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
    .case-grid .card{margin-bottom:0}
  }

  /* ================= case card ================= */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .card.s-pass{box-shadow:inset 3px 0 0 var(--pass)}
  .card.s-fail{box-shadow:inset 3px 0 0 var(--fail)}
  .card.s-blocked{box-shadow:inset 3px 0 0 var(--blocked)}
  .card.s-na{box-shadow:inset 3px 0 0 var(--na)}
  .card.open{border-color:var(--accent)}
  .card-head{display:flex;width:100%;gap:10px;align-items:flex-start;padding:13px 14px;cursor:pointer;background:none;border:none;text-align:left}
  .card-head:hover{background:var(--surface-2)}
  .case-id{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--fg-muted);flex:0 0 auto;padding-top:2px;min-width:56px}
  .case-main{flex:1;min-width:0;display:block}
  .case-scenario{display:block;font-size:14px;font-weight:600;margin:0 0 3px}
  .case-module{display:block;font-size:11.5px;color:var(--fg-muted)}
  .case-right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .pill.pass{color:var(--pass);background:var(--pass-bg)}
  .pill.fail{color:var(--fail);background:var(--fail-bg)}
  .pill.blocked{color:var(--blocked);background:var(--blocked-bg)}
  .pill.na, .pill.notrun{color:var(--na);background:var(--na-bg)}
  .prio{font-size:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  .prio.hi{color:var(--fail)}
  .chev{flex:0 0 auto;color:var(--fg-muted);font-size:14px;line-height:1;padding-top:3px}

  /* ================= case dialog ================= */
  body.modal-open{overflow:hidden}
  .case-overlay{z-index:55}
  .case-overlay.still{animation:none}
  .cm{width:100%;max-width:980px;max-height:calc(100dvh - 48px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .case-overlay:not(.still) .cm{animation:pop .16s ease-out}
  @keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0}}
  .cm-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 14px;border-bottom:1px solid var(--border)}
  .cm-title{flex:1;min-width:0}
  .cm-kicker{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--fg-muted)}
  .cm-kicker .mono{font-weight:600}
  .cm-kicker .prio{margin-left:4px}
  .cm-head h3{font-size:17px;margin:4px 0 0;letter-spacing:-.01em}
  .cm-head .pill{margin-top:2px}
  .cm-close{font-size:14px;padding:4px 8px;margin:-2px -6px 0 0}
  .cm-scroll{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
  .cm-body{padding:4px 18px 18px}
  .cm-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface-2)}
  @media (max-width:639px){
    .case-overlay{padding:0;align-items:stretch}
    .cm{max-width:none;max-height:none;height:100dvh;border-radius:0;border:none}
    .cm-head{padding:max(14px, env(safe-area-inset-top,0px)) 16px 12px}

  .body-cols{display:block}

  .field-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);margin:14px 0 6px;display:flex;align-items:center;gap:8px}

  .shot-row{display:flex;flex-wrap:wrap;gap:8px}

  .shot-add{position:relative;width:72px;height:72px;border-radius:8px;border:1px dashed var(--border);background:transparent;color:var(--fg-muted);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}

  /* ================= states ================= */

  /* ================= login ================= */
  .login-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}

  /* ================= modal / lightbox / toast ================= */
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .12s ease-out}

  /* ================= dashboard ================= */
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .page-head h2{font-size:20px;margin:0 0 2px;letter-spacing:-.015em}

  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);display:flex;align-items:center;gap:6px}
  .kpi .val{font-family:var(--font-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.2}

  .dash-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
  .dash-grid > *{min-width:0}
  @media (min-width:1180px){ .dash-grid{grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);align-items:start} }
  .section-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);margin:0 2px 10px}

  @media (max-width:639px){ .section-title .hint{display:none} }
  .app-grid{display:grid;gap:12px}
  @media (min-width:760px){ .app-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))} }
  .app-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .app-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .app-card-head h3{font-size:14.5px;margin:0}
  .app-card-head .sub{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted)}
  .plat-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px;background:none;border:none;border-top:1px solid var(--border);cursor:pointer;text-align:left}
  .app-card-head + .plat-row{border-top:none}
  .plat-row:hover{background:var(--surface-2)}
  .plat-name{font-family:var(--font-mono);font-size:12px;font-weight:600}
  .plat-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted)}
  .plat-stats span{display:inline-flex;align-items:center;gap:4px}
  .plat-pct{font-family:var(--font-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
  .plat-pct small{display:block;font-size:10.5px;color:var(--fg-muted);font-weight:500}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .panel-head h3{font-size:13.5px;margin:0}
  .panel-empty{padding:22px 14px;font-size:12.5px;color:var(--fg-muted);text-align:center}
  .feed-item{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 14px;border:none;border-top:1px solid var(--border);background:none;text-align:left;cursor:pointer;font-size:13px}

  .feed-item .note{display:block;font-size:12px;color:var(--fg-muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kpi-hero{display:flex;gap:18px;align-items:center}
  .donut{width:104px;height:104px;transform:rotate(-90deg);flex:0 0 auto;display:block}
  .donut circle{fill:none;stroke-width:11}

  .donut-seg{transition:stroke-dasharray .7s cubic-bezier(.2,.7,.2,1), stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1)}
  .hero-txt{min-width:0}
  .hero-txt .sub + .sub{margin-top:2px}
  .app-card-head .last{display:block;font-size:11px;color:var(--fg-muted);margin-top:2px}
  .app-card-head .last b{color:var(--fg);font-weight:600}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow-x:auto}
  .htable{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
  .htable th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);font-weight:600;padding:0;border-bottom:1px solid var(--border);white-space:nowrap}
  .htable th button{all:unset;cursor:pointer;display:flex;align-items:center;gap:4px;padding:10px 12px;width:100%;box-sizing:border-box}
  .htable th button:hover{color:var(--fg)}

  .htable .num{font-variant-numeric:tabular-nums;font-weight:600}

  /* ================= history ================= */
  .select{padding:7px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-family:var(--font-mono);font-size:12px}

  .history-row{display:grid;grid-template-columns:52px 84px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--border);font-size:13px;align-items:start}

  @media (max-width:560px){ .history-row{grid-template-columns:44px 1fr} .history-row .pillcell,.history-row .what{grid-column:2} }
</style>

<body>

<div id="loginScreen" class="login-screen" hidden>

</div>

<script>
(function(){
  "use strict";

  // ===================================================================
  // config
  // ===================================================================
  var APPS = [
    {id:"vip", label:"VIP"},
    {id:"goride", label:"GoRide"},
    {id:"godriver", label:"GoDriver"},
    {id:"tapngo", label:"Tap n Go"},
    {id:"moveet", label:"Moveet"}
  ];
  var PLATFORMS = [{id:"ios", label:"iOS"}, {id:"android", label:"Android"}];
  var RESULTS = [
    {key:"Pass", cls:"pass", kb:"p", title:"Works as expected"},
    {key:"Fail", cls:"fail", kb:"f", title:"Doesn't match the expected result"},
    {key:"Blocked", cls:"blocked", kb:"b", title:"Can't run this case right now"},
    {key:"N/A", cls:"na", kb:"n", title:"Doesn't apply to this build"}
  ];
  var FILTERS = ["All", "Not run", "Fail", "Blocked", "Pass", "N/A"];   // what needs attention first
  var CLS = {"Pass":"pass", "Fail":"fail", "Blocked":"blocked", "N/A":"na", "Not run":"notrun"};
  var POLL_MS = 5000;
  var MAX_IMAGE_BYTES = 3 * 1024 * 1024;
  var THEMES = [{id:"system", label:"Auto"}, {id:"light", label:"Light"}, {id:"dark", label:"Dark"}];

  // ===================================================================
  // storage (always guarded — private windows can throw)
  // ===================================================================
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },

    });
    $("sbProjMeta").textContent = active + "/" + APPS.length + " active";

    var who = $("whoBtn");
    who.innerHTML = "";
    who.classList.toggle("missing", !S.tester);
    who.appendChild(el("span", {class: "avatar", text: initials(S.tester), "aria-hidden": "true"}));
    who.appendChild(el("span", {class: "txt"}, [
      el("span", {class: "name", text: S.tester || "Set your name"}),
      el("span", {class: "sub", text: S.tester ? "Testing as you · change" : "Required before recording"})
    ]));
    who.appendChild(el("span", {class: "role-badge" + (isAdmin() ? " admin" : ""), text: isAdmin() ? "admin" : "tester"}));
    who.setAttribute("aria-label", S.tester ? "Testing as " + S.tester + ". Change name" : "Set your tester name");

    var seg = $("themeSeg");
    seg.innerHTML = "";
    THEMES.forEach(function(t){
      seg.appendChild(el("button", {type: "button", "aria-pressed": String(S.theme === t.id), "data-fk": "theme:" + t.id, text: t.label,
        title: t.id === "system" ? "Follow your device setting" : t.label + " mode",
        onclick: function(){ setTheme(t.id); }}));
    });
    $("adminSettingsBtn").hidden = !isAdmin();
  }

  var TITLES = {
    dashboard: {title: "Dashboard", sub: "Where every project stands. Latest result per case across all testers."},
    history: {title: "History", sub: "Every result and note change, newest first."},
    cases: {sub: "Walk through each case on the app, pick a result, add a note if anything's off."}
  };
  function renderTopbar(){
    var crumbs = $("crumbs");
    crumbs.innerHTML = "";
    if (S.view === "cases") {
      crumbs.appendChild(el("button", {type: "button", text: "Dashboard", onclick: function(){ goView("dashboard"); }}));
      crumbs.appendChild(el("span", {text: "/", "aria-hidden": "true"}));
      crumbs.appendChild(el("span", {text: "Projects"}));
    }
    crumbs.hidden = S.view !== "cases";
    $("pageTitle").textContent = S.view === "cases" ? appLabel(S.app) : TITLES[S.view].title;
    $("subtitle").textContent = TITLES[S.view].sub;
    $("contextRow").hidden = S.view !== "cases";
    var row = $("platformRow");
    row.innerHTML = "";
    PLATFORMS.forEach(function(p){
      row.appendChild(el("button", {
        class: "platform-chip", "aria-pressed": String(S.platform === p.id), text: p.label, "data-fk": "plat:" + p.id,
        onclick: function(){ if (S.platform !== p.id) goCases(S.app, p.id); }
      }));
    });
    renderProgress();
    renderConn();
    document.title = (S.view === "cases" ? appLabel(S.app) + " · " : S.view === "history" ? "History · " : "") + "UAT Tracker";
  }

  function renderProgress(){
    var track = $("progressTrack"), label = $("progressLabel");
    track.innerHTML = ""; label.innerHTML = "";
    var ready = S.casesStatus[S.app] === "ready" && S.results[curKey()];
    if (!ready) { label.textContent = "Loading…"; track.removeAttribute("aria-valuenow"); return; }
    var c = tally();
    if (!c.total) { label.textContent = "No cases"; return; }
    var bar = stackedBar(c, "hdr:" + curKey());
    while (bar.firstChild) track.appendChild(bar.firstChild);
    track.setAttribute("aria-valuemax", String(c.total));
    track.setAttribute("aria-valuenow", String(c.done));
    track.setAttribute("aria-label", c.done + " of " + c.total + " cases recorded on " + platLabel(S.platform));
    label.appendChild(el("b", {text: c.done + " / " + c.total}));
    label.appendChild(document.createTextNode(" done · " + c.pct + "%"));
  }

  // ===================================================================
  // navigation
  // ===================================================================
  function goCases(appId, platform){
    flushAllComments();
    var changed = appId !== S.app || platform !== S.platform || S.view !== "cases";
    S.view = "cases"; S.app = appId; S.platform = platform;
    if (changed) { S.openCard = null; S.filter = "All"; S.query = ""; }
    store.set("uat_app", appId); store.set("uat_platform", platform); store.set("uat_view", "cases");
    if (isDrawer()) setSidebar(false);
    loadCases();
    window.scrollTo({top: 0});
  }
  function goView(v){
    flushAllComments();
    if (v === "history" && !isAdmin()) v = "dashboard";
    S.view = v; S.openCard = null; store.set("uat_view", v);
    if (isDrawer()) setSidebar(false);
    if (v === "dashboard") loadOverview().catch(function(){}).then(function(){ if (S.view === "dashboard") render(); });
    else if (v === "history") loadHistory();
    render();
    window.scrollTo({top: 0});
  }
  // Jump straight to a case from anywhere (dashboard, history).
  function goToCase(appId, platform, caseId){
    if (!APPS.some(function(a){ return a.id === appId; })) return;
    S.pendingOpen = caseId;
    goCases(appId, validPlatform(platform));
  }

  function render(){
    if (!S.auth) return;
    preservingFocus(function(){
      renderSidebar();
      renderTopbar();
      var main = $("main");
      main.innerHTML = "";
      if (S.view === "cases") renderCases(main);
      else if (S.view === "dashboard") renderDashboard(main);
      else renderHistory(main);
      renderCaseModal();
    });
    S.dirty = false;
    flushAnims();
    syncUrl();
  }

  // ===================================================================
  // routing: #/dashboard · #/history · #/p/<app>/<platform>[/<caseId>]
  // ===================================================================
  var applyingRoute = false, modalPushed = false;
  function routeHash(){
    if (S.view === "dashboard") return "#/dashboard";
    if (S.view === "history") return "#/history";
    var c = S.openCard || S.pendingOpen;
    return "#/p/" + S.app + "/" + S.platform + (c ? "/" + encodeURIComponent(c) : "");
  }
  function parseRoute(h){
    var parts = String(h || "").replace(/^#\/?/, "").split("/").map(function(x){ try { return decodeURIComponent(x); } catch(e){ return x; } });
    if (parts[0] === "dashboard") return {view: "dashboard"};
    if (parts[0] === "history") return {view: "history"};
    if (parts[0] === "p" && APPS.some(function(a){ return a.id === parts[1]; }))
      return {view: "cases", app: parts[1], platform: validPlatform(parts[2]), caseId: parts[3] || null};
    return null;
  }
  function syncUrl(){
    if (!S.auth) return;
    var h = routeHash();
    if (location.hash === h) return;
    var cur = parseRoute(location.hash), next = parseRoute(h);
    // Stepping between cases inside the dialog replaces history instead of stacking it.
    var sameList = cur && next && cur.view === "cases" && next.view === "cases" && cur.app === next.app && cur.platform === next.platform;
    var stepping = sameList && cur.caseId && next.caseId;
    var closing = sameList && cur.caseId && !next.caseId;
    var opening = sameList && !cur.caseId && next.caseId;
    // Closing a dialog we opened from the list goes back, so Back never reopens it.
    if (closing && modalPushed && !applyingRoute) { modalPushed = false; history.back(); return; }
    if (applyingRoute || S.replaceUrl || stepping || closing || !location.hash) history.replaceState(null, "", h);
    else { history.pushState(null, "", h); modalPushed = !!opening; }
    S.replaceUrl = false;
  }
  function applyRoute(r){
    applyingRoute = true;
    try {
      r = r || {view: "dashboard"};
      if (r.view === "cases") {
        if (S.view === "cases" && S.app === r.app && S.platform === r.platform) { if (S.openCard !== r.caseId) openCase(r.caseId, {reveal: true}); }
        else { S.pendingOpen = r.caseId; goCases(r.app, r.platform); }
      } else if (S.view !== r.view || S.openCard) goView(r.view);
    } finally { applyingRoute = false; }
  }
  window.addEventListener("popstate", function(){
    if (!S.auth) return;
    closeModal(); closeLightbox();
    var r = parseRoute(location.hash);
    if (!(r && r.view === "cases" && r.caseId)) modalPushed = false;
    applyRoute(r);
  });

  // ===================================================================
  // data loading
  // ===================================================================
  function hasActiveSave(k, caseId){
    var s = S.saves[k + "|" + caseId];
    return !!s && (s.inflight || Object.keys(s.pending).length > 0);
  }
  function signature(map){
    return Object.keys(map || {}).sort().map(function(id){
      var r = map[id]; return id + ":" + (r.result || "") + ":" + (r.tester || "") + ":" + (r.comments || "").length + ":" + r.updatedAt;
    }).join("|");
  }
  // Several testers can record the same case; keep the most recent one
  // (same rule as the server summary). Replaces the given keys wholesale.
  function ingestResults(rows, keys){
    var fresh = {};
    keys.forEach(function(k){ fresh[k] = {}; });
    (rows || []).forEach(function(row){
      if (!row.caseId) return;
      var bucket = fresh[rk(row.app, row.platform)];
      if (!bucket) return;
      var cur = bucket[row.caseId];
      if (!cur || new Date(row.updatedAt) > new Date(cur.updatedAt)) bucket[row.caseId] = row;
    });
    var changed = false;
    keys.forEach(function(k){
      var prev = S.results[k] || {};
      Object.keys(prev).forEach(function(id){ if (hasActiveSave(k, id)) fresh[k][id] = prev[id]; });
      if (!S.results[k] || signature(prev) !== signature(fresh[k])) changed = true;
      S.results[k] = fresh[k];
      S.resultsStatus[k] = "ready";
    });
    return changed;
  }

  // Everything, for the dashboard and sidebar: all cases + all results.
  function loadOverview(){
    if (S.overviewStatus !== "ready") S.overviewStatus = "loading";
    return Promise.all([api("/api/testcases"), api("/api/results")]).then(function(res){
      var byApp = {};
      APPS.forEach(function(a){ byApp[a.id] = []; });
      (res[0] || []).forEach(function(c){ if (byApp[c.app]) byApp[c.app].push(c); });
      var casesChanged = false;
      APPS.forEach(function(a){
        byApp[a.id].sort(function(x, y){ return (x.order || 0) - (y.order || 0); });
        if (!S.cases[a.id] || S.cases[a.id].length !== byApp[a.id].length) casesChanged = true;
        S.cases[a.id] = byApp[a.id]; S.casesStatus[a.id] = "ready";
      });
      var keys = [];
      APPS.forEach(function(a){ PLATFORMS.forEach(function(p){ keys.push(rk(a.id, p.id)); }); });
      var changed = ingestResults(res[1], keys) || casesChanged || !S.overviewAt;
      S.overviewStatus = "ready"; S.overviewAt = Date.now();
      setConn("live");
      return changed;
    }).catch(function(e){
      S.overviewStatus = S.overviewAt ? "ready" : "error";
      S.loadError.overview = e.message;
      setConn(e.network ? "offline" : "syncing");
      throw e;
    });
  }

  function fetchResults(appId, platform){
    var k = rk(appId, platform);
    return api("/api/results?app=" + encodeURIComponent(appId) + "&platform=" + encodeURIComponent(platform)).then(function(rows){
      var changed = ingestResults(rows, [k]);
      setConn("live");
      return changed;
    }).catch(function(e){
      if (!S.results[k]) S.resultsStatus[k] = "error";
      S.loadError[k] = e.message;
      setConn(e.network ? "offline" : "syncing");
      throw e;
    });
  }

  function loadAttachments(appId, platform){
    return api("/api/attachments?app=" + encodeURIComponent(appId) + "&platform=" + encodeURIComponent(platform)).then(function(rows){
      var byCase = {};
      (rows || []).forEach(function(a){ (byCase[a.caseId] = byCase[a.caseId] || []).push(a); });
      S.attachments[rk(appId, platform)] = byCase;
    }).catch(function(){ /* non-critical */ });
  }

  function loadComments(appId){
    return api("/api/comments?app=" + encodeURIComponent(appId)).then(function(rows){
      S.comments[appId] = rows || []; S.commentsStatus[appId] = "ready";
    }).catch(function(){ if (!S.comments[appId]) S.commentsStatus[appId] = "error"; });
  }

  function loadCases(){
    var appId = S.app, platform = S.platform, k = curKey();
    if (S.casesStatus[appId] !== "ready") S.casesStatus[appId] = "loading";
    if (S.resultsStatus[k] === "error") S.resultsStatus[k] = "loading";
    render();

    var casesP = S.casesStatus[appId] === "ready"
      ? Promise.resolve(S.cases[appId])
      : api("/api/testcases?app=" + encodeURIComponent(appId)).then(function(rows){
          S.cases[appId] = rows || []; S.casesStatus[appId] = "ready"; return rows;
        }, function(e){ S.casesStatus[appId] = "error"; S.loadError[appId] = e.message; throw e; });

    Promise.allSettled([casesP, fetchResults(appId, platform), loadComments(appId), loadAttachments(appId, platform)])
      .then(function(){
        if (S.view !== "cases" || S.app !== appId || S.platform !== platform) return;
        var want = S.pendingOpen; S.pendingOpen = null;
        if (want && (S.cases[appId] || []).some(function(c){ return c.id === want; })) openCase(want, {reveal: true});
        else { if (want) { S.replaceUrl = true; toast("Case " + want + " wasn't found in " + appLabel(appId) + ".", {error: true}); } render(); }
      });
  }

  function startPolling(){ stopPolling(); S.pollTimer = setInterval(poll, POLL_MS); }
  function stopPolling(){ clearInterval(S.pollTimer); S.pollTimer = null; }
  function poll(){
    if (document.hidden || !S.auth) return;
    retryFailedSaves();
    S.tick++;
    var view = S.view, appId = S.app, platform = S.platform, p = null;
    if (view === "cases") p = fetchResults(appId, platform);
    // The dashboard refreshes every 10s; elsewhere the sidebar catches up every 30s.
    if ((view === "dashboard" && S.tick % 2 === 0) || S.tick % 6 === 0) {
      var o = loadOverview();
      p = p ? Promise.all([p, o]).then(function(r){ return r[0] || r[1]; }) : o;
    }
    if (!p) { if (S.dirty && !isTyping() && !activeModal) render(); return; }
    p.then(function(changed){
      if (S.view !== view || S.app !== appId || S.platform !== platform) return;
      if (changed || S.dirty) {
        if (isTyping() || activeModal) S.dirty = true; else render();
      }
    }).catch(function(){});
  }
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && S.auth) poll(); });
  window.addEventListener("online", function(){ if (S.auth) poll(); });

  // ===================================================================
  // saving results (optimistic, with retry)
  // ===================================================================
  function saveResult(caseId, patch, appId, platform){
    appId = appId || S.app; platform = platform || S.platform;
    var k = rk(appId, platform), sk = k + "|" + caseId;
    var map = S.results[k] || (S.results[k] = {});
    var existing = map[caseId];
    // Only merge onto my own record — never relabel another tester's note as mine.
    var base = existing && existing.tester === S.tester ? existing : {caseId: caseId, app: appId, platform: platform, tester: S.tester};
    map[caseId] = Object.assign({}, base, patch, {updatedAt: new Date().toISOString()});
    var sv = S.saves[sk] || (S.saves[sk] = {pending: {}, state: "idle"});
    Object.assign(sv.pending, patch);
    sv.ctx = {caseId: caseId, app: appId, platform: platform, tester: S.tester};
    flushSave(sk);
  }
  function flushSave(sk){
    var sv = S.saves[sk];
    if (!sv || sv.inflight || !Object.keys(sv.pending).length) return;
    var sent = sv.pending;
    sv.pending = {};
    sv.inflight = true; sv.state = "saving";
    updateSaveUI(sk); renderConn();
    api("/api/results", {method: "POST", body: Object.assign({}, sv.ctx, sent)}).then(function(){
      sv.inflight = false;
      if (Object.keys(sv.pending).length) return flushSave(sk);
      sv.state = "saved"; sv.at = Date.now();
      setConn("live"); updateSaveUI(sk);
    }, function(e){
      sv.inflight = false;
      sv.pending = Object.assign({}, sent, sv.pending);
      sv.state = "error"; sv.error = e.message;
      if (e.network) setConn("offline"); else renderConn();
      updateSaveUI(sk);
    });
  }
  function retryFailedSaves(){
    Object.keys(S.saves).forEach(function(sk){ if (S.saves[sk].state === "error") flushSave(sk); });
  }
  function updateSaveUI(sk){
    var nodes = document.querySelectorAll("[data-save]");
    for (var i = 0; i < nodes.length; i++) if (nodes[i].getAttribute("data-save") === sk) paintSaveState(nodes[i], sk);
  }
  function paintSaveState(node, sk){
    var sv = S.saves[sk];
    node.innerHTML = ""; node.className = "save-state";
    if (!sv) return;
    if (sv.state === "typing") { node.textContent = "Editing…"; return; }
    if (sv.state === "saving") { node.appendChild(el("span", {class: "spinner"})); node.appendChild(document.createTextNode("Saving…")); return; }
    if (sv.state === "saved") { node.classList.add("saved"); node.textContent = "✓ Saved " + fmtTime(sv.at); return; }
    if (sv.state === "error") {
      node.classList.add("error");
      node.appendChild(document.createTextNode("Not saved: " + (sv.error || "server error") + " "));
      node.appendChild(el("button", {class: "link-btn", type: "button", text: "Retry now", onclick: function(){ flushSave(sk); }}));
    }
  }
  window.addEventListener("beforeunload", function(ev){
    flushAllComments();
    if (unsavedCount()) { ev.preventDefault(); ev.returnValue = ""; }
  });

  var commentTimers = {};
  function queueComment(caseId, value){
    var sk = curKey() + "|" + caseId;
    var sv = S.saves[sk] || (S.saves[sk] = {pending: {}, state: "idle"});
    sv.state = "typing"; updateSaveUI(sk);
    clearTimeout(commentTimers[sk] && commentTimers[sk].t);
    commentTimers[sk] = {caseId: caseId, value: value, app: S.app, platform: S.platform, t: setTimeout(function(){ flushComment(sk); }, 800)};
  }
  function flushComment(sk){
    var c = commentTimers[sk]; if (!c) return;
    clearTimeout(c.t); delete commentTimers[sk];
    saveResult(c.caseId, {comments: c.value}, c.app, c.platform);
  }
  function flushAllComments(){ Object.keys(commentTimers).forEach(flushComment); }

  // ===================================================================
  // case actions
  // ===================================================================
  function setResult(c, key){
    requireTester(function(){
      var map = S.results[curKey()] || {};
      if (statusOf(map, c.id) === key) return;
      saveResult(c.id, {result: key});
      render();
      if (key === "Fail" || key === "Blocked") {
        var box = document.querySelector('[data-fk="comment:' + c.id + '"]');
        if (box && !box.value.trim()) box.focus();
      }
    });
  }

  function visibleCases(){
    var cases = S.cases[S.app] || [];
    var map = S.results[curKey()] || {};
    var q = S.query.trim().toLowerCase();
    return cases.filter(function(c){
      if (S.filter !== "All" && statusOf(map, c.id) !== S.filter) return false;
      if (!q) return true;
      return [c.id, c.scenario, c.module, c.expected, c.steps].join(" ").toLowerCase().indexOf(q) !== -1;
    });
  }

  function openCase(id, opts){
    opts = opts || {};
    flushAllComments();
    var prev = S.openCard;
    S.openCard = id;
    if (opts.reveal && id && !visibleCases().some(function(c){ return c.id === id; })) { S.filter = "All"; S.query = ""; }
    render();
    if (!id && prev) {
      var h = document.querySelector('[data-fk="head:' + prev + '"]');
      if (h) { h.focus({preventScroll: true}); h.scrollIntoView({block: "nearest"}); }
    }
  }
  function stepCase(dir){
    var list = visibleCases();
    if (!list.length) return;
    var i = list.findIndex(function(c){ return c.id === S.openCard; });
    var j = i === -1 ? (dir > 0 ? 0 : list.length - 1) : i + dir;
    if (j < 0 || j >= list.length) return;
    openCase(list[j].id);
  }
  function nextUntested(afterId){
    var cases = S.cases[S.app] || [];
    var map = S.results[curKey()] || {};
    var start = afterId ? cases.findIndex(function(c){ return c.id === afterId; }) + 1 : 0;
    for (var n = 0; n < cases.length; n++) {
      var c = cases[(start + n) % cases.length];
      if (statusOf(map, c.id) === "Not run" && c.id !== afterId) return c;
    }
    return null;
  }

  // ===================================================================
  // screenshots
  // ===================================================================
  function fetchImage(id){
    if (S.imgCache[id]) return Promise.resolve(S.imgCache[id]);
    return api("/api/attachments/" + id + "/image").then(function(d){
      var src = "data:" + d.mimeType + ";base64," + d.image;
      S.imgCache[id] = src; return src;
    });
  }
  function uploadAttachment(caseId, file){
    if (!file) return;
    if (!/^image\//.test(file.type || "")) { toast("Only images can be attached (PNG, JPG, HEIC…).", {error: true}); return; }
    if (file.size > MAX_IMAGE_BYTES) { toast("That image is " + (file.size / 1048576).toFixed(1) + " MB. Attach one under 3 MB.", {error: true}); return; }
    requireTester(function(){
      var appId = S.app, platform = S.platform, uk = rk(appId, platform) + "|" + caseId;
      S.uploads[uk] = (S.uploads[uk] || 0) + 1;
      render();
      var reader = new FileReader();
      function done(){ S.uploads[uk] = Math.max(0, (S.uploads[uk] || 1) - 1); if (S.view === "cases") render(); }
      reader.onerror = function(){ done(); toast("Couldn't read that file.", {error: true}); };
      reader.onload = function(){
        var base64 = String(reader.result).split(",")[1];
        api("/api/attachments", {method: "POST", body: {
          caseId: caseId, app: appId, platform: platform, tester: S.tester,
          image: base64, filename: file.name || "screenshot.png", mimeType: file.type || "image/png"
        }}).then(function(){
          toast("Screenshot attached to " + caseId + ".");
          return loadAttachments(appId, platform);
        }).catch(function(e){
          toast("Upload failed: " + e.message, {error: true, action: {label: "Try again", run: function(){ uploadAttachment(caseId, file); }}});
        }).then(done);
      };
      reader.readAsDataURL(file);
    });
  }
  function confirmDeleteAttachment(a){
    openModal({
      title: "Delete this screenshot?",
      desc: (a.filename || "Screenshot") + " from " + a.caseId + " will be removed for everyone. This can't be undone.",
      submitLabel: "Delete", danger: true,
      onSubmit: function(close, setBusy){
        setBusy(true, "Deleting…");
        api("/api/attachments/" + a._id, {method: "DELETE"}).then(function(){
          delete S.imgCache[a._id];
          return loadAttachments(a.app, a.platform);
        }).then(function(){ close(); toast("Screenshot deleted."); render(); })
          .catch(function(e){ setBusy(false); toast("Couldn't delete: " + e.message, {error: true}); });
      }
    });
  }
  var lightbox = null;
  function openLightbox(a){
    closeLightbox();
    var img = el("img", {alt: a.filename || "Screenshot"});
    var cap = el("div", {class: "cap"}, [
      el("span", {class: "spinner"}),
      el("span", {text: a.caseId + " · " + platLabel(a.platform) + " · " + (a.tester || "") + " · " + timeAgo(a.createdAt)})
    ]);
    lightbox = el("div", {class: "overlay lightbox", role: "dialog", "aria-label": "Screenshot preview"}, [
      el("button", {class: "btn sm close", text: "Close ✕", onclick: closeLightbox}), img, cap
    ]);
    lightbox.addEventListener("click", function(ev){ if (ev.target === lightbox || ev.target === img) closeLightbox(); });
    document.body.appendChild(lightbox);
    lightbox.querySelector(".close").focus();
    fetchImage(a._id).then(function(src){ img.src = src; var sp = cap.querySelector(".spinner"); if (sp) sp.remove(); })
      .catch(function(e){ cap.textContent = "Couldn't load image: " + e.message; });
  }
  function closeLightbox(){ if (lightbox) { lightbox.remove(); lightbox = null; } }

      return;
    }
    if (cs !== "ready" || !S.results[k]) { main.appendChild(skeleton(6)); return; }
    var cases = S.cases[appId];
    if (!cases.length) {
      main.appendChild(stateBox("No test cases for " + appLabel(appId) + " yet", "Ask an admin to load them (npm run seed), then refresh this page."));
      return;
    }
    var map = S.results[k];
    var counts = tally();

    var filterRow = el("div", {class: "filter-row", role: "group", "aria-label": "Filter by result"});
    FILTERS.forEach(function(f){
      var n = f === "All" ? counts.total : counts[f];
      filterRow.appendChild(el("button", {
        class: "filter-chip", "aria-pressed": String(S.filter === f), "data-fk": "filter:" + f,
        onclick: function(){ S.filter = f; render(); }
      }, [f !== "All" ? el("span", {class: "sdot " + CLS[f], "aria-hidden": "true"}) : null, f, el("span", {class: "count", text: String(n)})]));
    });
    var search = el("input", {type: "search", placeholder: "Search cases", "aria-label": "Search cases", value: S.query, "data-fk": "search", id: "searchInput"});
    var searchTimer;
    search.addEventListener("input", function(){ clearTimeout(searchTimer); searchTimer = setTimeout(function(){ S.query = search.value; render(); }, 150); });
    search.addEventListener("keydown", function(ev){ if (ev.key === "Escape") { search.value = ""; S.query = ""; search.blur(); render(); } });
    main.appendChild(el("div", {class: "toolbar"}, [filterRow, el("label", {class: "search"}, [search, el("kbd", {text: "/"})])]));

    main.appendChild(renderNextUp(counts));
    main.appendChild(renderNotes());

    var list = visibleCases();
    if (!list.length) {
      main.appendChild(stateBox("No cases match",
        (S.query ? "Nothing matches “" + S.query + "”" : "No cases are " + S.filter) + " on " + platLabel(S.platform) + ".",
        {label: "Clear filters", run: function(){ S.filter = "All"; S.query = ""; render(); }}));
      return;
    }
    var groups = [], byName = {};
    list.forEach(function(c){
      var m = c.module || "General";
      if (!byName[m]) { byName[m] = {name: m, cases: []}; groups.push(byName[m]); }
      byName[m].cases.push(c);
    });
    groups.forEach(function(g){
      var all = cases.filter(function(c){ return (c.module || "General") === g.name; });
      var done = all.filter(function(c){ return statusOf(map, c.id) !== "Not run"; }).length;
      var grid = el("div", {class: "case-grid"});
      g.cases.forEach(function(c){ grid.appendChild(renderCard(c, map)); });
      main.appendChild(el("section", {class: "module", "aria-label": g.name}, [
        el("div", {class: "module-head"}, [el("h2", {text: g.name}), el("span", {class: "mono", text: done + "/" + all.length + " done"})]),
        grid
      ]));

  function renderNextUp(counts){
    var remaining = counts.total - counts.done;
    var other = PLATFORMS.filter(function(p){ return p.id !== S.platform; })[0];
    if (!remaining) {
      var issues = counts.Fail + counts.Blocked;
      var actions = [];
      if (issues) actions.push(el("button", {class: "btn", text: "Review " + plural(issues, "issue"), onclick: function(){ S.filter = counts.Fail ? "Fail" : "Blocked"; render(); }}));
      actions.push(el("button", {class: "btn primary", text: "Switch to " + other.label + " →", onclick: function(){ goCases(S.app, other.id); }}));
      return el("div", {class: "banner done"}, [
        el("div", {class: "banner-text"}, [
          el("strong", {text: "All " + counts.total + " cases recorded on " + platLabel(S.platform)}),
          el("span", {class: "muted", text: counts.Pass + " passed · " + counts.Fail + " failed · " + counts.Blocked + " blocked · " + counts["N/A"] + " N/A"})
        ]),
        el("div", {class: "banner-actions"}, actions)
      ]);
    }
    var next = nextUntested(null);
    return el("div", {class: "banner"}, [

    var box = el("section", {class: "notes-box"});
    box.appendChild(el("button", {
      class: "notes-toggle", "aria-expanded": String(S.notesOpen), "data-fk": "notes-toggle",

    }, [
      el("span", {class: "notes-title", text: "General notes for " + appLabel(appId)}),

    ]));
    if (!S.notesOpen) return box;
    var body = el("div", {class: "notes-body"});
    var ta = el("textarea", {placeholder: "Anything worth flagging that isn't tied to one case? (build number, device, general crashes…)", "aria-label": "New note", "data-fk": "note-new"});
    var btn = el("button", {class: "btn primary", type: "button", text: "Post", disabled: true});

    ta.addEventListener("keydown", function(ev){ if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) btn.click(); });

      var text = ta.value.trim(); if (!text) return;
      requireTester(function(){

  function renderCard(c, map){

  function parseSteps(steps){
    var lines = String(steps || "").split(/\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
    var numbered = lines.length > 0 && lines.every(function(l){ return /^\d+[.)]\s*/.test(l); });
    return {numbered: numbered, lines: numbered ? lines.map(function(l){ return l.replace(/^\d+[.)]\s*/, ""); }) : lines};
  }

  // The case dialog. Rebuilt on every render; scroll + focus are preserved.
  var lastModalCase = null;
  function renderCaseModal(){
    var layer = $("caseLayer");
    var prevScroll = layer.querySelector(".cm-scroll");
    var keepScroll = prevScroll && lastModalCase === S.openCard ? prevScroll.scrollTop : 0;
    layer.innerHTML = "";
    var c = S.view === "cases" && S.openCard && (S.cases[S.app] || []).filter(function(x){ return x.id === S.openCard; })[0];

    var isNew = lastModalCase !== c.id;
    lastModalCase = c.id;

    var map = S.results[curKey()] || {};
    var r = map[c.id] || {};
    var status = statusOf(map, c.id);
    var k = curKey(), sk = k + "|" + c.id;

    var row = el("div", {class: "result-row", role: "group", "aria-label": "Result"});
    RESULTS.forEach(function(opt){
      row.appendChild(el("button", {
        class: "result-btn " + opt.cls, "aria-pressed": String(status === opt.key), title: opt.title + " (" + opt.kb.toUpperCase() + ")",

        ? "Describe what actually happened so the devs can reproduce it. A screenshot helps too."

    }
    right.appendChild(el("p", {class: "field-label"}, [el("label", {for: "cm-" + c.id, text: "Notes"}),

    var ta = el("textarea", {

      ]);

      img.addEventListener("click", function(){ openLightbox(a); });
      fetchImage(a._id).then(function(src){ img.src = src; img.hidden = false; ph.remove(); })
        .catch(function(){ ph.textContent = "!"; ph.title = "Couldn't load"; });

    for (var u = 0; u < uploading; u++) shotRow.appendChild(el("div", {class: "shot-thumb", "aria-label": "Uploading"}, [el("span", {class: "ph"}, [el("span", {class: "spinner"})])]));

    right.appendChild(shotRow);
    right.appendChild(el("div", {class: "shot-help", text: "Images up to 3 MB. You can also paste a screenshot (Ctrl/⌘+V) while this case is open."}));
    body.appendChild(el("div", {class: "body-cols"}, [left, right]));

    // move on
    var list = visibleCases();

    var foot = el("div", {class: "cm-foot"}, [
      el("span", {class: "shortcut-hint"}, [el("kbd", {text: "P"}), el("kbd", {text: "F"}), el("kbd", {text: "B"}), el("kbd", {text: "N"}), " result · ", el("kbd", {text: "J"}), el("kbd", {text: "K"}), " next/prev · ", el("kbd", {text: "?"}), " all shortcuts"]),
      el("div", {class: "foot-nav"}, [
        el("button", {class: "btn ghost", type: "button", text: "← Prev", disabled: idx <= 0, onclick: function(){ stepCase(-1); }}),
        el("button", {class: "btn", type: "button", text: "Next →", disabled: idx === -1 || idx >= list.length - 1, onclick: function(){ stepCase(1); }}),
        nextTodo && status !== "Not run"
          ? el("button", {class: "btn primary", type: "button", "data-fk": "next-todo", text: "Next untested: " + nextTodo.id, onclick: function(){ openCase(nextTodo.id, {reveal: true}); }})
          : null
      ])
    ]);

    var head = el("div", {class: "cm-head"}, [
      el("div", {class: "cm-title"}, [
        el("div", {class: "cm-kicker"}, [
          el("span", {class: "mono", text: c.id}), el("span", {text: "·"}), el("span", {text: appLabel(S.app) + " · " + platLabel(S.platform) + " · " + c.module}),
          c.priority ? el("span", {class: "prio" + (prioHi ? " hi" : ""), text: c.priority}) : null

        }}, refreshing ? [el("span", {class: "spinner"}), "Refreshing"] : ["Refresh"])

    });
